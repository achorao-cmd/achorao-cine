<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Canje de Entradas - Achorao</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; flex-direction: column; padding: 15px;}
        
        .login-box { background: #333; padding: 30px; border-radius: 10px; text-align: center; max-width: 400px; width: 100%; box-sizing: border-box; }
        input { padding: 10px; margin: 10px 0; width: 90%; border-radius: 5px; border: none; box-sizing: border-box;}
        button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; text-transform: uppercase; width: 90%; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        #sala-cine, #ticket-final { display: none; text-align: center; margin-top: 10px; width: 100%; max-width: 900px; }
        .pantalla { background: linear-gradient(to bottom, #555, #333); height: 40px; width: 80%; margin: 0 auto 30px auto; border-radius: 50% 50% 0 0; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 10px; color: #aaa; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        .grid-asientos { display: grid; grid-template-columns: repeat(23, 1fr); gap: 4px; margin: 0 auto; justify-content: center;}
        .asiento { background: #fff; color: #000; width: 100%; aspect-ratio: 1; border-radius: 4px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        
        /* Estados de Asientos */
        .asiento.seleccionado { background: #e50914; color: white; border: 1px solid #fff; }
        .asiento.ocupado { background: #555; color: #222; cursor: not-allowed; }
        .asiento.nodisponible { background: #444; color: #999; cursor: not-allowed; font-size: 12px;} 
        .asiento.bloqueado-lateral { background: #111; color: #333; cursor: not-allowed; border: 1px solid #222; }
        .asiento.vacio { visibility: hidden; } 
        
        .leyenda { margin-top: 20px; font-size: 12px; background: #222; padding: 10px; border-radius: 8px; display: inline-block;}
        
        .ticket-box { background: #fdfdfd; color: #111; width: 100%; max-width: 320px; margin: 0 auto; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; overflow: hidden; text-align: left; }
        .ticket-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 3px dashed #bbb; }
        .ticket-content { padding: 25px; position: relative; }
        .ticket-content h2 { margin: 0 0 15px 0; font-size: 22px; text-transform: uppercase; color: #e50914; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .ticket-content p { margin: 8px 0; font-size: 15px; }
        .ticket-asientos { font-size: 24px !important; color: #e50914; font-weight: 900; display: block; margin-top: 5px;}
        .recorte { position: absolute; width: 30px; height: 30px; background: #1a1a1a; border-radius: 50%; top: 185px; }
        .recorte.izq { left: -15px; }
        .recorte.der { right: -15px; }
        .disclaimer { font-size: 11px; color: #777; margin-top: 20px; line-height: 1.4; text-align: justify;}

        @media (max-width: 600px) {
            .grid-asientos { gap: 2px; }
            .asiento { font-size: 7px; border-radius: 2px; }
            .asiento.nodisponible { font-size: 9px; }
            .pantalla { height: 25px; font-size: 10px; letter-spacing: 5px; margin-bottom: 20px;}
        }
    </style>
</head>
<body>

    <div class="login-box" id="login-section">
        <h2>🎬 Canjea tu Entrada</h2>
        <input type="text" id="pedido" placeholder="N° de Pedido (Ej. 17325)">
        <input type="text" id="dni" placeholder="Correo o DNI">
        <button onclick="verificarDatos()" id="btn-ingresar">Ingresar</button>
        <p id="mensaje"></p>
    </div>

    <div id="sala-cine">
        <h2>Tus Asientos</h2>
        <p id="info-cliente"></p>
        <div class="pantalla">PANTALLA</div>
        <div class="grid-asientos" id="contenedor-asientos"></div>
        <div class="leyenda">
            ⬜ Disponible &nbsp; 🟥 Elegido &nbsp; ⬛ Ocupado &nbsp; ✖️ No Disp.
        </div>
        <br><br>
        <button id="btn-confirmar" style="display:none;" onclick="confirmarAsientos()">Confirmar Mis Asientos</button>
        <p id="mensaje-confirmacion"></p>
    </div>

    <div id="ticket-final">
        <p style="color: #4CAF50; font-weight: bold; margin-bottom: 20px;">¡Captura esta pantalla!</p>
        <div class="ticket-box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQq3Wtwc3T9NThwYT08_HR5Ih__G7j4W__uqAYMwKs0GwFfGYujpeaEKCw&s=10" class="ticket-img">
            <div class="recorte izq"></div>
            <div class="recorte der"></div>
            <div class="ticket-content">
                <h2>Cine Ticket</h2>
                <p><b>Pedido:</b> <span id="ticket-pedido"></span></p>
                <p><b>Snacks:</b> <span id="ticket-snacks"></span></p>
                <p><b>Asientos:</b> <span id="ticket-asientos" class="ticket-asientos"></span></p>
                <p class="disclaimer">⚠️ ACÉRCATE A NUESTRO EQUIPO EN LA PUERTA: Canjea esta captura por tus entradas y vales físicos oficiales. No vayas directo a la barra.</p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA CON TU ENLACE LARGO
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa-fIjQ3RR7hSpMfuc76BNhz495XXY6Rn2WoNkrNyYqRHUefW3mb8qC2ePkTd1PX5KaQ/exec";
        
        let entradasPermitidas = 0;
        let asientosSeleccionados = [];
        let pedidoActual = "";
        let snacksActual = "";
        let todosLosAsientosOcupados = [];

        async function verificarDatos() {
            const pedido = document.getElementById('pedido').value.trim();
            const dni = document.getElementById('dni').value.trim();
            const mensajeEl = document.getElementById('mensaje');
            const btnIngresar = document.getElementById('btn-ingresar');

            if (!pedido || !dni) { mensajeEl.textContent = "Completa ambos campos."; return; }
            
            mensajeEl.textContent = "Buscando tu pedido... 🍿";
            mensajeEl.style.color = "white";
            btnIngresar.disabled = true;

            try {
                const respuesta = await fetch(GOOGLE_SCRIPT_URL);
                const datos = await respuesta.json();
                let encontrado = false; 
                let datosCliente = null;
                todosLosAsientosOcupados = [];

                for (let i = 1; i < datos.length; i++) {
                    let pedidoFila = String(datos[i][0]).trim().toLowerCase();
                    let dniFila = String(datos[i][1]).trim().toLowerCase();
                    let asientosFila = String(datos[i][5] || "").trim();

                    if (asientosFila !== "") {
                        let asientosArray = asientosFila.split(",").map(a => a.trim());
                        todosLosAsientosOcupados = todosLosAsientosOcupados.concat(asientosArray);
                    }

                    if (pedidoFila === pedido.toLowerCase() && dniFila === dni.toLowerCase()) {
                        encontrado = true;
                        datosCliente = datos[i];
                    }
                }

                if (encontrado) {
                    pedidoActual = datosCliente[0];
                    entradasPermitidas = parseInt(datosCliente[2]) || 0;
                    snacksActual = datosCliente[3] || "Ninguno";
                    let misAsientosYaElegidos = String(datosCliente[5] || "").trim();

                    document.getElementById('login-section').style.display = 'none';

                    if (misAsientosYaElegidos !== "") {
                        mostrarTicket(misAsientosYaElegidos);
                    } else if (entradasPermitidas > 0) {
                        document.getElementById('sala-cine').style.display = 'block';
                        document.getElementById('info-cliente').innerHTML = `Tienes <b>${entradasPermitidas} entradas</b> por ubicar.`;
                        generarAsientos();
                    } else if (entradasPermitidas === 0 && snacksActual !== "NO" && snacksActual !== "") {
                        mostrarTicket("Sin asientos (Solo Snacks)");
                    } else {
                        mensajeEl.textContent = "Este pedido no tiene entradas válidas.";
                        mensajeEl.style.color = "#e50914";
                        document.getElementById('login-section').style.display = 'block';
                    }
                } else {
                    mensajeEl.textContent = "Datos incorrectos o no encontrados."; 
                    mensajeEl.style.color = "#e50914";
                    btnIngresar.disabled = false;
                }
            } catch (error) {
                mensajeEl.textContent = "Error de conexión. Intenta nuevamente.";
                btnIngresar.disabled = false;
            }
        }

        function generarAsientos() {
            const contenedor = document.getElementById('contenedor-asientos');
            contenedor.innerHTML = ""; 
            const filas = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q','R','S'];
            
            // Asientos exactos bloqueados con 'X' en el plano (ACTUALIZADO)
            const asientosX = ['F9','F8', 'I12','I11', 'J12','J11', 'K13','K12', 'L18','L17', 'P8','P7', 'Q12','Q11'];

            filas.forEach(fila => {
                for (let num = 23; num >= 1; num--) {
                    let idAsiento = `${fila}${num}`;
                    let div = document.createElement('div');
                    div.className = 'asiento';
                    div.textContent = idAsiento;
                    
                    if (num > 18 || num < 6) {
                        if (fila === 'S' && (num === 21 || num === 20 || num === 19 || num === 5)) {
                            div.classList.add('vacio');
                        } else {
                            div.classList.add('bloqueado-lateral');
                        }
                    } 
                    else {
                        if (fila === 'M' || fila === 'N' || fila === 'O') {
                            div.classList.add('vacio');
                        } 
                        // Fila P: P7 y P8 ahora son visibles (tienen X), solo P18 y P6 son espacios vacíos
                        else if (fila === 'P' && (num === 18 || num === 6)) {
                            div.classList.add('vacio');
                        }
                        else if ((fila === 'Q' || fila === 'R') && (num === 18 || num === 6)) {
                            div.classList.add('vacio');
                        }
                        else if (fila === 'S' && (num === 18 || num <= 13)) {
                            div.classList.add('vacio');
                        }
                        else if (asientosX.includes(idAsiento)) {
                            div.classList.add('nodisponible');
                            div.textContent = "X";
                        }
                        else {
                            if (todosLosAsientosOcupados.includes(idAsiento)) {
                                div.classList.add('ocupado');
                            } else {
                                div.onclick = () => seleccionarAsiento(div, idAsiento);
                            }
                        }
                    }
                    contenedor.appendChild(div);
                }
            });
        }

        function seleccionarAsiento(elemento, idAsiento) {
            if (elemento.classList.contains('seleccionado')) {
                elemento.classList.remove('seleccionado');
                asientosSeleccionados = asientosSeleccionados.filter(a => a !== idAsiento);
            } else {
                if (asientosSeleccionados.length < entradasPermitidas) {
                    elemento.classList.add('seleccionado');
                    asientosSeleccionados.push(idAsiento);
                } else {
                    alert(`Solo puedes seleccionar ${entradasPermitidas} asientos.`);
                }
            }
            document.getElementById('btn-confirmar').style.display = (asientosSeleccionados.length === entradasPermitidas) ? 'inline-block' : 'none';
        }

        async function confirmarAsientos() {
            const btnConfirmar = document.getElementById('btn-confirmar');
            const msjConfirmacion = document.getElementById('mensaje-confirmacion');
            
            btnConfirmar.disabled = true;
            msjConfirmacion.textContent = "Guardando tus asientos... ⏳";
            
            const asientosString = asientosSeleccionados.join(", ");
            
            try {
                const urlGuardar = `${GOOGLE_SCRIPT_URL}?action=guardar&pedido=${pedidoActual}&asientos=${encodeURIComponent(asientosString)}`;
                await fetch(urlGuardar);
                mostrarTicket(asientosString);
            } catch (error) {
                msjConfirmacion.textContent = "Hubo un error al guardar. Intenta de nuevo.";
                msjConfirmacion.style.color = "red";
                btnConfirmar.disabled = false;
            }
        }

        function mostrarTicket(asientos) {
            document.getElementById('sala-cine').style.display = 'none';
            document.getElementById('ticket-final').style.display = 'block';
            
            document.getElementById('ticket-pedido').textContent = pedidoActual;
            document.getElementById('ticket-asientos').textContent = asientos;
            document.getElementById('ticket-snacks').textContent = snacksActual;
        }
    </script>
</body>
</html>
